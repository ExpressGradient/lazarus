[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lazarus"
version = "0.3.5"
description = "A coding agent with persistent IPython state and model-controlled context loops"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Sai Praneeth Diddigam", email = "hi@saipraneeth.in" },
]
dependencies = [
    "ipython>=9.15.0",
    "kosong[contrib]>=0.53.0",
]

[project.scripts]
lazarus = "lazarus.cli:main"

[project.urls]
Homepage = "https://github.com/ExpressGradient/lazarus"
Repository = "https://github.com/ExpressGradient/lazarus"
